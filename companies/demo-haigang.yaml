# 虚构演示企业（FICTIONAL demo company, ADR-0023）。企业名、地址、人员都是编的，如有雷同纯属巧合。
# 国内版演示：中文界面、人民币、北京时间、公制；数据结构与 Harbor Lane Supply 相同，数字另编。
version: 1
demo: true
company:
  name: 海港五金供应（演示）
  abbr: HGWJ
  country: China
  currency: CNY
  timezone: Asia/Shanghai
  fiscal_year_start: "01-01"
  date_format: yyyy-mm-dd
  language: zh
  units:
    weight: kg
    length: cm
