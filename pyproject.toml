[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenquest-ops"
version = "0.1.0"
description = "AI-native operations platform for small and mid-sized businesses, built on ERPNext"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guoqing (Eddie) Zhang" }]
dependencies = [
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
hub = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "pypdf>=3.17",
    "python-docx>=1.1",
    "pillow>=10.1",
    "pytesseract>=0.3.10",
]
dev = [
    "wenquest-ops[hub]",
    "pytest>=8",
    "ruff>=0.16.9,<0.17",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
]

[tool.setuptools.packages.find]
include = ["wqops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL", "RUF", "DTZ"]
ignore = ["PLR2004", "PLR0913", "S101", "RUF001", "RUF002", "RUF003"]  # RUF00x: Chinese text in docs and tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]
"wqops/hub/udi_api.py" = ["B008"]  # FastAPI dependencies are declared as argument defaults
