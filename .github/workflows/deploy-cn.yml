name: Deploy to the WenQuest server in China

# ADR-0024: WenQuest Ops as a module on the WenQuest server in China (阿里云上海), which reaches neither GitHub nor
# Docker Hub. Everything goes over SSH from here:
#   1. the hub image of this commit and the base images are copied into the server's own registry (127.0.0.1:5000,
#      through an SSH tunnel; names under qms/), only missing layers travel;
#   2. the deployment files go to /opt/wenquest/qms;
#   3. under the server's deploy lock (shared with the WenQuest platform): install.sh the first time (Chinese demo
#      company, --china --edge --small --project qms --mirror 127.0.0.1:5000/qms) and the demo data, upgrade.sh later;
#   4. a daily backup at 04:10 (7 kept), status and memory use, the last 3 hub versions kept in the registry.
# Needs the secrets CN_DEPLOY_HOST and CN_DEPLOY_SSH_KEY (a key only for this repository, made on the server by the
# project lead); without them nothing happens. The site's name comes from the WenQuest platform's SITE_DOMAIN on the
# server (qms.<domain> and qms-erp.<domain>), or from the repository variable CN_QMS_DOMAIN.
# The DeepSeek key and the owner's password are set on the server by the project lead, never here.
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cn
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HOST: ${{ secrets.CN_DEPLOY_HOST }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BASE: frappe/erpnext:v16.34.1 caddy:2.10-alpine postgres:16-alpine mariadb:11.8 redis:6.2-alpine
    steps:
      - name: Check the settings
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::CN_DEPLOY_HOST is not set: no server in China to deploy to."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "TAG=sha-${SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        if: env.SKIP != '1'
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        if: env.SKIP != '1'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          printf 'Host cn\n  HostName %s\n  User deploy\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' "$HOST" \
            > ~/.ssh/config
          ssh cn 'echo connected; df -h / | tail -1; free -m | head -2'
          # under the WenQuest platform's directory, which deploy owns: no root step on the server
          if ! ssh cn 'mkdir -p /opt/wenquest/qms && test -w /opt/wenquest/qms'; then
            echo "::error::cannot create /opt/wenquest/qms as deploy"
            exit 1
          fi
          ssh cn 'curl -sf http://127.0.0.1:5000/v2/ >/dev/null' \
            || { echo "::error::the server's registry (127.0.0.1:5000) does not answer; the WenQuest deployment starts it"; exit 1; }
      - name: Copy the images into the server's registry (through an SSH tunnel; only missing layers travel)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          ssh -fN -o ExitOnForwardFailure=yes -L 5000:127.0.0.1:5000 cn
          for _ in $(seq 1 15); do curl -sf http://localhost:5000/v2/ >/dev/null && break; sleep 2; done
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          hub="ghcr.io/${{ github.repository_owner }}/wenquest-ops-hub"
          if ! skopeo inspect --creds "$creds" "docker://$hub:$TAG" >/dev/null 2>&1; then
            # a run by hand on a commit that changed no hub sources: the newest hub image
            echo "no hub image for $TAG; using latest"
            TAG=latest; echo "TAG=latest" >> "$GITHUB_ENV"
          fi
          copy() {   # $1 source, $2 name under qms/, $3 credentials
            for i in 1 2 3 4; do
              curl -sf http://localhost:5000/v2/ >/dev/null || ssh -fN -o ExitOnForwardFailure=yes -L 5000:127.0.0.1:5000 cn || true
              start=$(date +%s)
              if skopeo copy --retry-times 3 --dest-tls-verify=false ${3:+--src-creds "$3"} "docker://$1" \
                   "docker://localhost:5000/qms/$2"; then
                echo "  qms/$2  $(( $(date +%s) - start )) s"; return 0
              fi
              echo "retry $i: $1"; sleep 20      # the WenQuest deployment may be cleaning its registry just now
            done
            return 1
          }
          copy "$hub:$TAG" "wenquest-ops-hub:$TAG" "$creds"
          for b in $BASE; do
            case "$b" in */*) src="docker.io/$b" ;; *) src="docker.io/library/$b" ;; esac
            copy "$src" "${b##*/}"
          done
      - name: Copy the deployment files to /opt/wenquest/qms
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          cp companies/demo-haigang.yaml deploy/company-demo.yaml
          tar czf - -C deploy . | ssh cn 'tar xzf - -C /opt/wenquest/qms && chmod +x /opt/wenquest/qms/*.sh'
      - name: Install the first time, else upgrade (under the server's deploy lock)
        if: env.SKIP != '1'
        env:
          CN_QMS_DOMAIN: ${{ vars.CN_QMS_DOMAIN }}
        run: |
          set -euo pipefail
          domain="$CN_QMS_DOMAIN"
          if [ -z "$domain" ]; then
            site=$(ssh cn "grep -E '^SITE_DOMAIN=' /opt/wenquest/.env 2>/dev/null | tail -n 1 | cut -d= -f2-" || true)
            [ -n "$site" ] && [ "$site" != example.com ] && domain="qms.$site"
          fi
          [ -n "$domain" ] || { echo "::error::no site name: set the repository variable CN_QMS_DOMAIN (e.g. qms.example.cn)"; exit 1; }
          erp="${domain/qms./qms-erp.}"; [ "$erp" != "$domain" ] || erp="erp.$domain"
          echo "WenQuest Ops: $domain   ERPNext: $erp"
          # shellcheck disable=SC2029   # the values are meant to expand here, before ssh
          ssh cn "TAG='$TAG' DOMAIN='$domain' ERP='$erp' bash -s" <<'EOF' 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          set -euo pipefail
          cd /opt/wenquest/qms
          exec 9>/tmp/wenquest-deploy.lock
          flock -w 1500 9 || { echo "the deploy lock stayed taken for 25 minutes"; exit 1; }
          if [ ! -f .installed ]; then
            echo "installation (first time, or again after an unfinished one: install.sh skips finished steps)"
            ./install.sh --company company-demo.yaml --domain "$DOMAIN" --erp-domain "$ERP" --image "$TAG" \
              --china --edge --small --project qms --mirror 127.0.0.1:5000/qms
            touch .installed
          else
            ./upgrade.sh "$TAG"
          fi
          if [ ! -f .demo-loaded ]; then
            echo "loading the Chinese demo company"
            docker compose -p qms --env-file .env -f docker-compose.yml exec -T hub python -m wqops.demo.load > demo.log 2>&1 \
              && touch .demo-loaded || { tail -n 30 demo.log; exit 1; }
            tail -n 5 demo.log
          fi
          EOF
      - name: Daily backup at 04:10, 7 kept (after the WenQuest backup at 03:30)
        if: env.SKIP != '1'
        run: |
          ssh cn 'line="10 4 * * * cd /opt/wenquest/qms && WQO_KEEP=7 ./backup.sh >> /opt/wenquest/qms/backups/backup.log 2>&1"
            { crontab -l 2>/dev/null | grep -v "/opt/wenquest/qms.*backup.sh" || true; echo "$line"; } | crontab -
            crontab -l | grep /opt/wenquest/qms'
      - name: Status and memory use
        if: env.SKIP != '1'
        run: |
          ssh cn '/opt/wenquest/qms/status.sh' || { echo "::error::status check failed"; exit 1; }
          mem=$(ssh cn "docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | grep -E '^qms' | sort; free -m | head -2")
          echo "$mem"
          echo "::notice title=memory on the server::$(printf '%s' "$mem" | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Keep the last 3 hub versions in the server's registry (no garbage-collect; the WenQuest deployment does it)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          # shellcheck disable=SC2029   # TAG is meant to expand here, before ssh
          ssh cn "TAG='$TAG' bash -s" <<'EOF'
          set -u
          R=http://127.0.0.1:5000; N=qms/wenquest-ops-hub
          H='Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          L=/opt/wenquest/qms/.hub-tags
          { grep -vx "$TAG" "$L" 2>/dev/null; echo "$TAG"; } > "$L.new" && mv "$L.new" "$L"
          keep=$(tail -n 3 "$L"); old=$(head -n -3 "$L")
          digest() { curl -sfI -H "$H" "$R/v2/$N/manifests/$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'; }
          kept=$(for t in $keep; do digest "$t"; done)
          n=0
          for t in $old; do
            d=$(digest "$t") || continue
            [ -n "$d" ] || continue
            echo "$kept" | grep -qx "$d" && continue
            curl -sf -X DELETE "$R/v2/$N/manifests/$d" >/dev/null && n=$((n+1))
          done
          printf '%s\n' $keep > "$L"
          echo "removed $n old hub versions; kept: $keep"
          EOF
      - name: Show the end of the log on failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/deploy.log" ] && echo "::error title=deploy-cn::$(grep -E 'ERROR|Error|error|failed' "$RUNNER_TEMP/deploy.log" | tail -n 10 | cut -c 1-300 | sed ':a;N;$!ba;s/\n/%0A/g')%0A---%0A$(tail -n 25 "$RUNNER_TEMP/deploy.log" | cut -c 1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          ssh cn 'cd /opt/wenquest/qms && docker compose -p qms --env-file .env -f docker-compose.yml ps -a' || true
