name: CI

# Public since 2026-10-14 (Actions minutes no longer billed); the heavy install job still runs only when needed.
# Lint and unit tests run on every push; the full install runs when deployment files change, nightly when main has
# new commits, on manual runs, or with the PR label full-ci.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      save_recordings:
        description: Push ERPNext's replies from the sync check to the branch ci/erp-recordings
        type: boolean
        default: false
      save_help_media:
        description: Push the help screenshots and videos to the branch ci/help-media
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wqo
          POSTGRES_PASSWORD: wqo
          POSTGRES_DB: wqo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wqo" --health-interval 5s --health-retries 20
    env:
      WQO_TEST_DB: postgresql://wqo:wqo@localhost:5432/wqo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim >/dev/null   # OCR of scans (ADR-0014, 0023)
          pip install -e ".[dev]"
          npm ci --prefix web --no-audit --no-fund
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -v -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Show failing tests as an annotation
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/pytest.log" ] && echo "::error title=pytest::$(grep -E '^(FAILED|ERROR)|^E  ' "$RUNNER_TEMP/pytest.log" \
            | head -n 40 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"

  scope:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      install: ${{ steps.s.outputs.install }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          WF: ci.yml
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci_scope.sh

  install:
    # Phase 1 item 3: one command on a clean machine installs ERPNext + WenQuest Ops for the demo company;
    # health check, the business in ERPNext, backup and restore.
    needs: [test, scope]
    if: needs.scope.outputs.install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # only used by the save_recordings and save_help_media steps on manual runs
    steps:
      - uses: actions/checkout@v5
      - name: Install directory
        run: echo "WQO_DIR=$RUNNER_TEMP/wqo" >> "$GITHUB_ENV"
      - name: Free disk (ERPNext images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the hub image (same Dockerfile as the published one; not pushed)
        run: docker build -q -t wenquest-ops-hub:ci .
      - name: Install with one command
        env:
          WQO_HUB_IMAGE: wenquest-ops-hub:ci
          WQO_MIN_DISK_GB: "8"
          WQO_OWNER_PASSWORD: Ci-owner-pass-2026
        run: |
          set -o pipefail
          mkdir -p "$WQO_DIR" && cp -r deploy/. "$WQO_DIR/"
          "$WQO_DIR/install.sh" --company companies/demo-harbor-lane.yaml --domain ops.localtest.me --tls-internal --no-pull \
            2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Check health, the company in ERPNext, backup and restore
        run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          set -x
          R=(--resolve ops.localtest.me:443:127.0.0.1 --resolve erp.ops.localtest.me:443:127.0.0.1)
          curl -fsk "${R[@]}" https://ops.localtest.me/api/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['ok'] and set(h['checks'].values())=={'ok'}, h"
          curl -fsk "${R[@]}" https://ops.localtest.me/login | grep -q "Harbor Lane Supply (Demo)"
          code=$(curl -sk "${R[@]}" -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
                 -d '{"email":"dana@demo.example","password":"wrong pass 1"}' https://ops.localtest.me/api/login)
          [ "$code" = 401 ]
          curl -fsk "${R[@]}" -c jar -H 'content-type: application/json' \
               -d '{"email":"dana@demo.example","password":"Ci-owner-pass-2026"}' https://ops.localtest.me/api/login
          grep -q wqo_session jar
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/users | python3 -c "
          import json,sys; u=json.load(sys.stdin); assert len(u)==7, u; print([x['email'] for x in u])"
          curl -fsk "${R[@]}" https://erp.ops.localtest.me/api/method/ping | grep -q pong
          erp() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" exec -T erp-backend \
                  bench --site frontend execute "$@" 2>/dev/null | tail -n 1; }
          [ "$(erp frappe.db.get_value --args "['Company', 'Harbor Lane Supply (Demo)', 'default_currency']")" = USD ]
          for w in "Receiving Dock - HLS" "Main Stock - HLS" "QC Hold - HLS" "Shipping Dock - HLS"; do
            [ "$(erp frappe.db.exists --args "['Warehouse', '$w']")" = "$w" ]
          done
          [ -n "$(erp frappe.db.exists --args "['Department', {'department_name': 'Quality', 'company': 'Harbor Lane Supply (Demo)'}]")" ]
          [ -n "$(erp frappe.db.exists --args "['Address', {'address_title': 'Tampa Distribution Center'}]")" ]
          # Open ERPNext without signing in again (ADR-0005): ERPNext's login link -> WenQuest Ops -> back, signed in
          url=$(erp frappe.utils.oauth.get_oauth2_authorize_url --args "['wenquest_ops', '/app']")
          echo "$url" | grep -q "^https://ops.localtest.me/api/oauth/authorize"
          back=$(curl -sk "${R[@]}" -b jar -o /dev/null -w '%{redirect_url}' "$url")
          echo "$back" | grep -q "^https://erp.ops.localtest.me/api/method/frappe.integrations.oauth2_logins.custom/wenquest_ops?code="
          curl -sk "${R[@]}" -c erpjar -o /dev/null "$back"
          curl -fsk "${R[@]}" -b erpjar https://erp.ops.localtest.me/api/method/frappe.auth.get_logged_user | tee who.json
          grep -q dana@demo.example who.json
          [ "$(erp frappe.db.get_value --args "['Has Role', {'parent': 'dana@demo.example', 'role': 'System Manager'}, 'role']")" = "System Manager" ]
          # ERPNext sync (ADR-0006): the owner pulls changes now; then created, changed and deleted documents in the
          # real ERPNext become events (own schema; ERPNext's replies are saved for the replay test)
          dc() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" "$@"; }
          for _ in $(seq 1 20); do
            code=$(curl -sk "${R[@]}" -b jar -o sync.json -w '%{http_code}' -X POST https://ops.localtest.me/api/sync/run)
            [ "$code" = 409 ] || break; sleep 3
          done
          cat sync.json; [ "$code" = 200 ]
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/sync/status | python3 -c "
          import json,sys; s=json.load(sys.stdin); d={x['doctype']: x['documents'] for x in s['doctypes']}
          assert d['Warehouse'] >= 4 and s['last_run']['status'] == 'ok', s; print(d)"
          dc exec -T hub python - < .github/scripts/erp_sync_e2e.py
          dc cp hub:/tmp/erp-recordings "$RUNNER_TEMP/erp-recordings"
          # Ops hub objects (ADR-0007): the documents made above become objects with links and stock levels
          curl -fsk "${R[@]}" -b jar -X POST https://ops.localtest.me/api/sync/run | tee sync2.json
          curl -fsk "${R[@]}" -b jar "https://ops.localtest.me/api/ont/objects/StockLevel/CI-WIDGET-01@Main%20Stock%20-%20HLS" \
            | python3 -c "import json,sys; o=json.load(sys.stdin); p={x['name']: x['value'] for x in o['props']}
          assert p['actual_qty'] == 10 and p['stock_value'] == 25, o; print(o['title'])"
          curl -fsk "${R[@]}" -b jar "https://ops.localtest.me/api/ont/search?q=CI-WIDGET-01&type=PurchaseOrder" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert len(r) == 2, r; print(r)"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/dashboard | python3 -c "import json,sys
          d=json.load(sys.stdin); m={x['name']: x['value'] for x in d['metrics']}; assert len(m) == 6, d; print(m)"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/anomalies | python3 -c "import json,sys
          a=json.load(sys.stdin); assert isinstance(a, list), a; print(len(a), 'active anomalies')"
          # the assistant without a model key answers with the rule engine (ADR-0008)
          curl -fsk "${R[@]}" -b jar -H 'content-type: application/json' -d '{"question":"What is the inventory value?"}' \
            https://ops.localtest.me/api/ai/ask | python3 -c "import json,sys
          a=json.load(sys.stdin); assert a['engine'] == 'rules' and a['answer'].startswith('Inventory value'), a; print(a['answer'])"
          # the web workspace (ADR-0007): pages and their assets come from the hub
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/anomalies | tee index.html | grep -q 'id="app"'
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -n 1)
          curl -fsk "${R[@]}" -o /dev/null "https://ops.localtest.me$asset"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/workspace | grep -q '"company":"Harbor Lane Supply (Demo)"'
          ls "$WQO_DIR"/backups/wqo-*.tar.gz
          b=$("$WQO_DIR/backup.sh" | tail -n 1)
          "$WQO_DIR/restore.sh" "$b" --yes
          for _ in $(seq 1 30); do curl -fsk "${R[@]}" https://ops.localtest.me/api/health >/dev/null && break; sleep 5; done
          [ "$(erp frappe.db.exists --args "['Warehouse', 'Main Stock - HLS']")" = "Main Stock - HLS" ]
          "$WQO_DIR/install.sh" --no-pull 2>&1 | tail -n 5        # running again is safe
          "$WQO_DIR/status.sh"
      - name: Load the demo business and check the ops hub shows its problems (ADR-0012)
        run: |
          exec > >(tee "$RUNNER_TEMP/demo.log") 2>&1
          set -x -o pipefail
          R=(--resolve ops.localtest.me:443:127.0.0.1)
          dc() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" "$@"; }
          time dc exec -T hub python -m wqops.demo.load | tee demo.json
          python3 -c "import json; t = open('demo.json').read().splitlines(); q = json.loads(chr(10).join(t[t.index('{'):]))['quality_samples']; print(q)
          bad = {k: v for k, v in q.items() if v.startswith(('not loaded', 'skipped'))}; assert not bad, bad"   # ADR-0019
          dc exec -T hub python - < .github/scripts/erp_consistency.py   # the hub matches ERPNext after a sync
          curl -fsk "${R[@]}" -c jar -H 'content-type: application/json' \
               -d '{"email":"dana@demo.example","password":"Ci-owner-pass-2026"}' https://ops.localtest.me/api/login
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/anomalies | python3 -c "import json,sys
          rules = {a['rule'] for a in json.load(sys.stdin)}; print(sorted(rules))
          need = {'order_late', 'item_short', 'po_late', 'supplier_on_time_low', 'capa_overdue'}
          assert need <= rules, need - rules"
          # nothing left over from a half-written business: the late orders are the recent ones the scenario makes
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/anomalies | python3 -c "import json,sys
          old = [a['title'] for a in json.load(sys.stdin) if a['rule'] == 'order_late' and a['values']['days_late'] > 30]
          assert not old, old"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/dashboard | python3 -c "import json,sys
          m = {x['name']: x['value'] for x in json.load(sys.stdin)['metrics']}; print(m)
          assert m['on_time_delivery'] is not None and m['inventory_value'] and m['supplier_on_time'] is not None, m"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/brief | python3 -c "import json,sys
          b = json.load(sys.stdin); print(b['text']); assert 'No open problems' not in b['text'], b"   # made from the loaded data
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/quality/incoming | grep -q CBL-12-50
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/quality/spc/parameters | grep -q HX-BOLT-M8
          curl -fsk "${R[@]}" -b jar -H 'content-type: application/json' -d '{"question":"Which orders are late?"}' \
            https://ops.localtest.me/api/ai/ask | python3 -c "import json,sys; a=json.load(sys.stdin); print(a['answer'])
          assert '[SalesOrder:' in a['answer'], a"
      - name: Record help screenshots and videos of the main flows on the demo company (ADR-0012)
        run: |
          exec > >(tee "$RUNNER_TEMP/media.log") 2>&1
          set -x -o pipefail
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/playwright" install --with-deps --only-shell chromium
          "$RUNNER_TEMP/pw/bin/python" -I .github/scripts/help_media.py https://ops.localtest.me dana@demo.example \
            Ci-owner-pass-2026 "$RUNNER_TEMP/help-media"
          ls -la "$RUNNER_TEMP/help-media"/*
      - name: Play every help tour on the demo company; record the help videos on manual runs (ADR-0019)
        env:
          HELP_FAST: ${{ (github.event_name == 'workflow_dispatch' && inputs.save_help_media) && '0' || '1' }}
        run: |
          exec > >(tee "$RUNNER_TEMP/tours.log") 2>&1
          set -x -o pipefail
          "$RUNNER_TEMP/pw/bin/pip" install -q pyyaml==6.0.3
          if [ "$HELP_FAST" = 0 ]; then sudo apt-get install -y -qq ffmpeg > /dev/null; fi
          "$RUNNER_TEMP/pw/bin/python" -I .github/scripts/help_tours.py https://ops.localtest.me dana@demo.example \
            Ci-owner-pass-2026 "$RUNNER_TEMP/help-media/topics"
      - name: Phase 1 acceptance smoke test in a browser - every role, the main flows (plan item 10)
        run: |
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -o pipefail
          "$RUNNER_TEMP/pw/bin/python" -I .github/scripts/smoke_p1.py https://ops.localtest.me dana@demo.example \
            Ci-owner-pass-2026
      - name: Keep the help screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-media
          path: ${{ runner.temp }}/help-media
          if-no-files-found: ignore
          retention-days: 14
      - name: Push the help screenshots and videos to ci/help-media (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.save_help_media
        env:
          TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/media-branch"; mkdir -p "$d" && cp -r "$RUNNER_TEMP/help-media/." "$d/" && cd "$d"
          git init -q -b ci/help-media && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "Help screenshots and videos from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:ci/help-media
      - name: Keep ERPNext's replies from the sync check (for tests/recordings/erpnext)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-recordings
          path: ${{ runner.temp }}/erp-recordings
          if-no-files-found: ignore
          retention-days: 7
      - name: Push the recordings to ci/erp-recordings (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.save_recordings
        env:
          TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/rec-branch"; mkdir -p "$d" && cp -r "$RUNNER_TEMP/erp-recordings/." "$d/" && cd "$d"
          git init -q -b ci/erp-recordings && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "ERPNext replies recorded by run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:ci/erp-recordings
      - name: Show the end of the logs as one annotation on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/demo.log" "$RUNNER_TEMP/media.log" "$RUNNER_TEMP/tours.log" "$RUNNER_TEMP/smoke.log"; do
            [ -f "$f" ] && echo "::error title=$(basename "$f")::$(tail -n 40 "$f" | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" ps -a || true
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" logs --tail 60 hub || true

  install-cn:
    # ADR-0023 step 23e: the same one-command install for a company in China (Chinese, CNY, Asia/Shanghai, metric):
    # ERPNext set up in Chinese, the business in ERPNext, the hub's texts in Chinese.
    needs: [test, scope]
    if: needs.scope.outputs.install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install directory
        run: echo "WQO_DIR=$RUNNER_TEMP/wqo" >> "$GITHUB_ENV"
      - name: Free disk (ERPNext images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the hub image (same Dockerfile as the published one; not pushed)
        run: docker build -q -t wenquest-ops-hub:ci .
      - name: Install with one command (Chinese demo company)
        env:
          WQO_HUB_IMAGE: wenquest-ops-hub:ci
          WQO_MIN_DISK_GB: "8"
          WQO_OWNER_PASSWORD: Ci-owner-pass-2026
        run: |
          set -o pipefail
          mkdir -p "$WQO_DIR" && cp -r deploy/. "$WQO_DIR/"
          "$WQO_DIR/install.sh" --company companies/demo-haigang.yaml --domain ops.localtest.me --tls-internal --no-pull \
            2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Check ERPNext in Chinese, the business, and the hub in Chinese
        run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          set -x
          R=(--resolve ops.localtest.me:443:127.0.0.1 --resolve erp.ops.localtest.me:443:127.0.0.1)
          cjk() { python3 -c "import sys; t=sys.stdin.read(); print(t[:400]); assert any('一' <= c <= '鿿' for c in t), 'no Chinese'"; }
          curl -fsk "${R[@]}" https://ops.localtest.me/api/health | python3 -c "
          import json,sys; h=json.load(sys.stdin); assert h['ok'], h"
          curl -fsk "${R[@]}" https://ops.localtest.me/login | tee login.html | grep -q "海港五金供应（演示）"
          grep -q "lang='zh-CN'" login.html
          curl -sk "${R[@]}" -H 'content-type: application/json' -d '{"email":"wangdan@demo.example","password":"wrong pass 1"}' \
               https://ops.localtest.me/api/login | cjk
          curl -fsk "${R[@]}" -c jar -H 'content-type: application/json' \
               -d '{"email":"wangdan@demo.example","password":"Ci-owner-pass-2026"}' https://ops.localtest.me/api/login
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/users | python3 -c "
          import json,sys; u=json.load(sys.stdin); assert len(u)==7, u"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/workspace | python3 -c "
          import json,sys; w=json.load(sys.stdin); print(w); assert w['language']=='zh' and w['currency']=='CNY', w"
          erp() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" exec -T erp-backend \
                  bench --site frontend execute "$@" 2>/dev/null | tail -n 1; }
          [ "$(erp frappe.db.get_value --args "['Company', '海港五金供应（演示）', 'default_currency']")" = CNY ]
          [ "$(erp frappe.db.get_single_value --args "['System Settings', 'language']")" = zh ]
          [ "$(erp frappe.db.get_single_value --args "['System Settings', 'time_zone']")" = Asia/Shanghai ]
          root=$(erp frappe.db.get_value --args "['Warehouse', {'company': '海港五金供应（演示）', 'is_group': 1, 'parent_warehouse': ['is', 'not set']}]")
          echo "root warehouse: $root"
          for w in "收货区 - HGWJ" "主仓 - HGWJ" "质检隔离仓 - HGWJ" "发货区 - HGWJ"; do
            [ "$(erp frappe.db.get_value --args "['Warehouse', '$w', 'parent_warehouse']")" = "$root" ]
          done
          [ -n "$(erp frappe.db.exists --args "['Department', {'department_name': '质量部', 'company': '海港五金供应（演示）'}]")" ]
          # bench prints non-ASCII as \uXXXX escapes
          erp frappe.db.get_value --args "['Account', {'company': '海港五金供应（演示）', 'account_type': 'Receivable'}]" \
            | python3 -c "import sys; print(sys.stdin.read().encode().decode('unicode_escape'))" | cjk
          for _ in $(seq 1 20); do
            code=$(curl -sk "${R[@]}" -b jar -o sync.json -w '%{http_code}' -X POST https://ops.localtest.me/api/sync/run)
            [ "$code" = 409 ] || break; sleep 3
          done
          cat sync.json; [ "$code" = 200 ]
          curl -fsk "${R[@]}" -b jar -H 'content-type: application/json' -d '{"question":"库存价值是多少？"}' \
            https://ops.localtest.me/api/ai/ask | python3 -c "import json,sys
          a=json.load(sys.stdin); print(a['answer']); assert a['engine'] == 'rules', a
          assert any('一' <= c <= '鿿' for c in a['answer']), a"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/qms | cjk
          "$WQO_DIR/status.sh"
      - name: Load the Chinese demo business and check the ops hub shows its problems in Chinese
        run: |
          exec > >(tee "$RUNNER_TEMP/demo.log") 2>&1
          set -x -o pipefail
          R=(--resolve ops.localtest.me:443:127.0.0.1)
          dc() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" "$@"; }
          time dc exec -T hub python -m wqops.demo.load | tee demo.json
          python3 -c "import json; t = open('demo.json').read().splitlines(); o = json.loads(chr(10).join(t[t.index('{'):]))
          q = o['quality_samples']; print(q); print(o['documents'], o['quality'])
          bad = {k: v for k, v in q.items() if v.startswith(('未导入', '已跳过'))}; assert not bad, bad
          assert o['documents']['files'] == 22, o['documents']"
          dc exec -T hub python - < .github/scripts/erp_consistency.py
          curl -fsk "${R[@]}" -c jar -H 'content-type: application/json' \
               -d '{"email":"wangdan@demo.example","password":"Ci-owner-pass-2026"}' https://ops.localtest.me/api/login
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/anomalies | python3 -c "import json,sys
          a = json.load(sys.stdin); rules = {x['rule'] for x in a}; print(sorted(rules)); print([x['title'] for x in a][:5])
          need = {'order_late', 'item_short', 'po_late', 'supplier_on_time_low', 'capa_overdue'}
          assert need <= rules, need - rules
          assert all(any('\u4e00' <= c <= '\u9fff' for c in x['title']) for x in a), 'titles not in Chinese'"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/dashboard | python3 -c "import json,sys
          m = {x['name']: x['value'] for x in json.load(sys.stdin)['metrics']}; print(m)
          assert m['on_time_delivery'] is not None and m['inventory_value'] and m['supplier_on_time'] is not None, m"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/quality/incoming | grep -q CBL-12-50
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/quality/spc/parameters | grep -q HX-BOLT-M8
          curl -fsk "${R[@]}" -b jar -H 'content-type: application/json' -d '{"question":"哪些订单迟交了？"}' \
            https://ops.localtest.me/api/ai/ask | python3 -c "import json,sys; a=json.load(sys.stdin); print(a['answer'])
          assert '[SalesOrder:' in a['answer'] and '按时交付率' in a['answer'], a"
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/docs/imports | head -c 800
      - name: Show the end of the logs as one annotation on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/demo.log"; do
            [ -f "$f" ] || continue
            # long JSON lines would fill the annotation: short lines, problems first, then the end of the log
            { grep -E 'DIFF|Error|Traceback|assert|differ' "$f" | tail -n 15; echo ---; tail -n 25 "$f"; } \
              | cut -c 1-300 | tr -d '\r' > "$f.short"
            echo "::error title=cn $(basename "$f")::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f.short")"
          done
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" ps -a || true
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" logs --tail 60 hub || true
