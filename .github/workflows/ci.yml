name: CI

# Private repository: Actions minutes are billed (same approach as freecad-ai-parts ADR-0067).
# Lint and unit tests run on every push; the full install runs when deployment files change, nightly when main has
# new commits, on manual runs, or with the PR label full-ci.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wqo
          POSTGRES_PASSWORD: wqo
          POSTGRES_DB: wqo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wqo" --health-interval 5s --health-retries 20
    env:
      WQO_TEST_DB: postgresql://wqo:wqo@localhost:5432/wqo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -v

  scope:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      install: ${{ steps.s.outputs.install }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          WF: ci.yml
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci_scope.sh

  install:
    # Phase 1 item 3: one command on a clean machine installs ERPNext + WenQuest Ops for the demo company;
    # health check, the business in ERPNext, backup and restore.
    needs: [test, scope]
    if: needs.scope.outputs.install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install directory
        run: echo "WQO_DIR=$RUNNER_TEMP/wqo" >> "$GITHUB_ENV"
      - name: Free disk (ERPNext images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the hub image (same Dockerfile as the published one; not pushed)
        run: docker build -q -t wenquest-ops-hub:ci .
      - name: Install with one command
        env:
          WQO_HUB_IMAGE: wenquest-ops-hub:ci
          WQO_MIN_DISK_GB: "8"
          WQO_OWNER_PASSWORD: Ci-owner-pass-2026
        run: |
          set -o pipefail
          mkdir -p "$WQO_DIR" && cp -r deploy/. "$WQO_DIR/"
          "$WQO_DIR/install.sh" --company companies/demo-harbor-lane.yaml --domain ops.localtest.me --tls-internal --no-pull \
            2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Check health, the company in ERPNext, backup and restore
        run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          set -x
          R=(--resolve ops.localtest.me:443:127.0.0.1 --resolve erp.ops.localtest.me:443:127.0.0.1)
          curl -fsk "${R[@]}" https://ops.localtest.me/api/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['ok'] and set(h['checks'].values())=={'ok'}, h"
          curl -fsk "${R[@]}" https://ops.localtest.me/login | grep -q "Harbor Lane Supply (Demo)"
          code=$(curl -sk "${R[@]}" -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
                 -d '{"email":"dana@demo.example","password":"wrong pass 1"}' https://ops.localtest.me/api/login)
          [ "$code" = 401 ]
          curl -fsk "${R[@]}" -c jar -H 'content-type: application/json' \
               -d '{"email":"dana@demo.example","password":"Ci-owner-pass-2026"}' https://ops.localtest.me/api/login
          grep -q wqo_session jar
          curl -fsk "${R[@]}" -b jar https://ops.localtest.me/api/users | python3 -c "
          import json,sys; u=json.load(sys.stdin); assert len(u)==7, u; print([x['email'] for x in u])"
          curl -fsk "${R[@]}" https://erp.ops.localtest.me/api/method/ping | grep -q pong
          erp() { docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" exec -T erp-backend \
                  bench --site frontend execute "$@" 2>/dev/null | tail -n 1; }
          [ "$(erp frappe.db.get_value --args "['Company', 'Harbor Lane Supply (Demo)', 'default_currency']")" = USD ]
          for w in "Receiving Dock - HLS" "Main Stock - HLS" "QC Hold - HLS" "Shipping Dock - HLS"; do
            [ "$(erp frappe.db.exists --args "['Warehouse', '$w']")" = "$w" ]
          done
          [ -n "$(erp frappe.db.exists --args "['Department', {'department_name': 'Quality', 'company': 'Harbor Lane Supply (Demo)'}]")" ]
          [ -n "$(erp frappe.db.exists --args "['Address', {'address_title': 'Tampa Distribution Center'}]")" ]
          # Open ERPNext without signing in again (ADR-0005): ERPNext's login link -> WenQuest Ops -> back, signed in
          url=$(erp frappe.utils.oauth.get_oauth2_authorize_url --args "['wenquestops', '/app']")
          echo "$url" | grep -q "^https://ops.localtest.me/api/oauth/authorize"
          back=$(curl -sk "${R[@]}" -b jar -o /dev/null -w '%{redirect_url}' "$url")
          echo "$back" | grep -q "^https://erp.ops.localtest.me/api/method/frappe.integrations.oauth2_logins.custom/wenquestops?code="
          curl -sk "${R[@]}" -c erpjar -o /dev/null "$back"
          curl -fsk "${R[@]}" -b erpjar https://erp.ops.localtest.me/api/method/frappe.auth.get_logged_user | tee who.json
          grep -q dana@demo.example who.json
          [ "$(erp frappe.db.get_value --args "['Has Role', {'parent': 'dana@demo.example', 'role': 'System Manager'}, 'role']")" = "System Manager" ]
          ls "$WQO_DIR"/backups/wqo-*.tar.gz
          b=$("$WQO_DIR/backup.sh" | tail -n 1)
          "$WQO_DIR/restore.sh" "$b" --yes
          for _ in $(seq 1 30); do curl -fsk "${R[@]}" https://ops.localtest.me/api/health >/dev/null && break; sleep 5; done
          [ "$(erp frappe.db.exists --args "['Warehouse', 'Main Stock - HLS']")" = "Main Stock - HLS" ]
          "$WQO_DIR/install.sh" --no-pull 2>&1 | tail -n 5        # running again is safe
          "$WQO_DIR/status.sh"
      - name: Show the end of the logs as one annotation on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/check.log"; do
            [ -f "$f" ] && echo "::error title=$(basename "$f")::$(tail -n 40 "$f" | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" ps -a || true
          docker compose -p wqo --env-file "$WQO_DIR/.env" -f "$WQO_DIR/docker-compose.yml" logs --tail 60 hub || true
