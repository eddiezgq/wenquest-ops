name: Images

# The hub image that installations pull (docs/ops/README.md). Built when its sources change on main or on a version
# tag; private, like the repository. Old untagged versions are cleaned up to keep package storage small.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "wqops/**", "companies/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wenquest-ops-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: wenquest-ops-hub
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^(latest|v?\d+\.\d+\.\d+)$'
